global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'job-scheduler'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'job-scheduler-1:8081'
          - 'job-scheduler-2:8081'
        labels:
          application: 'job-scheduler'
