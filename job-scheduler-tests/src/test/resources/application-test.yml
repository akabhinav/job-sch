spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///test_scheduler
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    clean-on-validation-error: true

scheduler:
  security:
    enabled: false
  cluster:
    enabled: false
