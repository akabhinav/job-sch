# Hazelcast Cluster Configuration
# ================================

# Cluster name
cluster.name=job-scheduler-cluster

# Cluster port (default: 5701)
cluster.port=5701

# Cluster members (comma-separated list of host:port)
# For local development
cluster.members=localhost

# For production, list all cluster members
# cluster.members=node1.example.com:5701,node2.example.com:5701,node3.example.com:5701

# CP Member count (for leader election and distributed locks)
# Should be an odd number >= 3 for production
cluster.cp-member-count=3

# Discovery configuration
cluster.multicast.enabled=false
cluster.tcp-ip.enabled=true

# Leader Election Configuration
# ================================

# Enable/disable leader election
cluster.leader.election.enabled=true

# Leader heartbeat interval in seconds
cluster.leader.heartbeat.interval=10

# Job Distribution Configuration
# ================================

# Distribution strategy:
# - ROUND_ROBIN: Distribute jobs in round-robin fashion
# - RANDOM: Random distribution
# - LEAST_LOADED: Send to least loaded node
# - PRIORITY_BASED: Based on node priority
# - CAPABILITY_AWARE: Based on node capabilities (CPU, memory)
# - CONSISTENT_HASHING: Consistent hashing for cache locality
# - WEIGHTED_ROUND_ROBIN: Weighted distribution based on priority
cluster.job.distribution.strategy=LEAST_LOADED

# Node Configuration
# ================================

# Node role: MASTER, WORKER, COORDINATOR, HYBRID
node.role=WORKER

# Supported job types (comma-separated, or ALL)
node.job.types=ALL
# node.job.types=BATCH,REALTIME,SCHEDULED

# Node tags for specialized routing (comma-separated)
node.tags=
# node.tags=gpu,high-memory,batch-processor

# Node priority (1-10, higher is better)
node.priority=5

# Health Check Configuration
# ================================

# Health check interval in seconds
cluster.health.check.interval=30

# Health thresholds (percentage)
cluster.health.threshold.cpu=90.0
cluster.health.threshold.memory=90.0
cluster.health.threshold.disk=90.0

# Hazelcast Management Center
# ================================

# Management center URL (if available)
# HAZELCAST_MC_URL=http://localhost:8080

# Logging Configuration
# ================================

# Logging levels
logging.level.com.enterprise.scheduler.cluster=INFO
logging.level.com.hazelcast=WARN

# Enable detailed cluster logging for debugging
# logging.level.com.enterprise.scheduler.cluster=DEBUG
# logging.level.com.hazelcast=DEBUG
