version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: job-scheduler-postgres
    environment:
      POSTGRES_DB: job_scheduler
      POSTGRES_USER: scheduler_user
      POSTGRES_PASSWORD: scheduler_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: job-scheduler-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: job-scheduler-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server=localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: job-scheduler-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: job-scheduler-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: job-scheduler-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Job Scheduler Application (Node 1)
  job-scheduler-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-scheduler-node-1
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_scheduler
      SPRING_DATASOURCE_USERNAME: scheduler_user
      SPRING_DATASOURCE_PASSWORD: scheduler_pass
      SCHEDULER_CLUSTER_ENABLED: true
      SCHEDULER_CLUSTER_MEMBERS: job-scheduler-1,job-scheduler-2
      HAZELCAST_NETWORK_JOIN_MULTICAST_ENABLED: false
      HAZELCAST_NETWORK_JOIN_TCP-IP_ENABLED: true
      HAZELCAST_NETWORK_JOIN_TCP-IP_MEMBERS: job-scheduler-1,job-scheduler-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Job Scheduler Application (Node 2)
  job-scheduler-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job-scheduler-node-2
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      SPRING_PROFILES_ACTIVE: production
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_scheduler
      SPRING_DATASOURCE_USERNAME: scheduler_user
      SPRING_DATASOURCE_PASSWORD: scheduler_pass
      SCHEDULER_CLUSTER_ENABLED: true
      SCHEDULER_CLUSTER_MEMBERS: job-scheduler-1,job-scheduler-2
      HAZELCAST_NETWORK_JOIN_MULTICAST_ENABLED: false
      HAZELCAST_NETWORK_JOIN_TCP-IP_ENABLED: true
      HAZELCAST_NETWORK_JOIN_TCP-IP_MEMBERS: job-scheduler-1,job-scheduler-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: job-scheduler-network
