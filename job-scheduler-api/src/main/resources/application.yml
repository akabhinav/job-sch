# Job Scheduler Application Configuration
# Features #43-70: REST API, WebSocket, and Operations

spring:
  application:
    name: job-scheduler

  # Profile Configuration
  profiles:
    active: ${ENV:development}

  # Database Configuration (Feature #25: Data Persistence)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_scheduler}
    username: ${DB_USERNAME:scheduler_user}
    password: ${DB_PASSWORD:scheduler_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: JobSchedulerHikariPool

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Flyway Configuration (Feature #25: Database Migration)
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: UTC

  # Task Execution Configuration (Feature #12: Parallel Job Execution)
  task:
    execution:
      pool:
        core-size: ${EXECUTOR_CORE_SIZE:10}
        max-size: ${EXECUTOR_MAX_SIZE:50}
        queue-capacity: ${EXECUTOR_QUEUE_SIZE:100}
        keep-alive: 60s
      thread-name-prefix: job-exec-

  # Task Scheduling Configuration
  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:5}
      thread-name-prefix: job-sched-

# Server Configuration (Feature #43: REST API)
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Management & Actuator Configuration (Feature #26: Health Checks)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,configprops
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    diskspace:
      enabled: true
      threshold: 10GB
    db:
      enabled: true

  # Metrics Configuration (Feature #23: Job Metrics Collection)
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active}

# Logging Configuration
logging:
  level:
    root: INFO
    com.enterprise.scheduler: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/job-scheduler.log}
    max-size: 10MB
    max-history: 30

# OpenAPI/Swagger Configuration (Feature #43: API Documentation)
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    filter: true

# Job Scheduler Configuration
scheduler:
  # Core Settings
  instance-id: ${INSTANCE_ID:scheduler-01}
  cluster-name: ${CLUSTER_NAME:job-scheduler-cluster}

  # Execution Configuration (Features #11, #12, #13, #14)
  execution:
    thread-pool-size: ${EXECUTOR_POOL_SIZE:20}
    max-concurrent-jobs: ${MAX_CONCURRENT_JOBS:100}
    default-timeout-ms: ${DEFAULT_TIMEOUT_MS:300000}
    allow-concurrent-execution: true

  # Retry Configuration (Feature #19: Job Retry Mechanism)
  retry:
    default-max-attempts: 3
    default-retry-delay-ms: 5000
    default-backoff-multiplier: 2.0
    default-max-retry-delay-ms: 60000

  # Schedule Configuration (Feature #3: Advanced Scheduling)
  scheduling:
    enabled: true
    check-interval-ms: 60000
    misfire-threshold-ms: 300000

  # Dependency Configuration (Feature #7: Job Dependency Management)
  dependency:
    max-depth: 10
    circular-check-enabled: true

  # Workflow Configuration (Feature #15: Workflow Orchestration)
  workflow:
    max-jobs-per-workflow: 50
    parallel-execution-enabled: true

# Cluster Configuration (Feature #33-36: Clustering)
cluster:
  enabled: ${CLUSTER_ENABLED:false}
  discovery:
    type: ${DISCOVERY_TYPE:static}
    static-nodes: ${CLUSTER_NODES:localhost:8080}
  heartbeat:
    interval-ms: 5000
    timeout-ms: 15000
  leader-election:
    enabled: true
    lease-duration-ms: 30000

# Security Configuration (Features #27-32, #68-70)
security:
  # JWT Configuration (Feature #27: JWT Authentication)
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
    expiration-ms: ${JWT_EXPIRATION:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:86400000}

  # API Key Configuration (Feature #28: API Key Authentication)
  api-key:
    enabled: true
    header-name: X-API-Key

  # RBAC Configuration (Feature #29: RBAC)
  rbac:
    enabled: true
    default-role: USER

  # Audit Configuration (Feature #30: Audit Logging)
  audit:
    enabled: true
    log-successful-auth: true
    log-failed-auth: true

# Multi-tenancy Configuration (Feature #70: Multi-tenancy)
multi-tenancy:
  enabled: ${MULTI_TENANCY_ENABLED:false}
  tenant-id-header: X-Tenant-ID
  default-tenant: default

# Monitoring Configuration (Features #23, #24, #26)
monitoring:
  # Metrics Collection (Feature #23)
  metrics:
    enabled: true
    collection-interval-ms: 60000
    retention-days: 30

  # Performance Analytics (Feature #24)
  analytics:
    enabled: true
    aggregation-interval-ms: 300000

  # Alerting Configuration
  alerting:
    enabled: true
    check-interval-ms: 60000
    email-notifications: ${ALERT_EMAIL_ENABLED:false}
    webhook-notifications: ${ALERT_WEBHOOK_ENABLED:false}

# Notification Configuration (Feature #20: Notification System)
notification:
  enabled: true
  email:
    enabled: ${EMAIL_ENABLED:false}
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    from: ${EMAIL_FROM:noreply@scheduler.com}
  webhook:
    enabled: ${WEBHOOK_ENABLED:true}
    timeout-ms: 5000
    retry-attempts: 3

# Plugin Configuration (Feature #42: Custom Job Type Support)
plugins:
  enabled: true
  scan-packages: com.enterprise.scheduler.plugins
  auto-register: true

# Backup Configuration (Feature #65: Backup/Restore)
backup:
  enabled: ${BACKUP_ENABLED:true}
  schedule: ${BACKUP_SCHEDULE:0 0 2 * * ?}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  location: ${BACKUP_LOCATION:./backups}

# Cache Configuration
cache:
  enabled: true
  type: caffeine
  caffeine:
    spec: maximumSize=1000,expireAfterWrite=10m

# Rate Limiting Configuration
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  requests-per-minute: ${RATE_LIMIT_RPM:100}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
  allowed-headers: "*"
  max-age: 3600

---
# Development Profile
spring:
  config:
    activate:
      on-profile: development

logging:
  level:
    com.enterprise.scheduler: DEBUG

scheduler:
  execution:
    thread-pool-size: 5
    max-concurrent-jobs: 10

---
# Production Profile
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    root: WARN
    com.enterprise.scheduler: INFO

server:
  compression:
    enabled: true

scheduler:
  execution:
    thread-pool-size: 50
    max-concurrent-jobs: 500

cluster:
  enabled: true

security:
  jwt:
    expiration-ms: 1800000

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

logging:
  level:
    root: WARN
    com.enterprise.scheduler: DEBUG
