# Persistence layer configuration
# Features #5: Job Persistence, #48: Multi-Database Support

spring:
  # JPA Configuration
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
        # Enable second-level cache
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory
        # Performance optimizations
        generate_statistics: false
        query:
          plan_cache_max_size: 2048
          in_clause_parameter_padding: true
    hibernate:
      ddl-auto: validate  # Let Flyway handle schema

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    placeholder-replacement: false
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

---
# PostgreSQL Configuration
spring:
  config:
    activate:
      on-profile: postgresql

  datasource:
    platform: postgresql
    url: jdbc:postgresql://localhost:5432/job_scheduler
    username: scheduler_user
    password: scheduler_pass
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: JobSchedulerHikariPool
      auto-commit: false
      leak-detection-threshold: 60000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

---
# H2 Configuration (for testing)
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    platform: h2
    url: jdbc:h2:mem:job_scheduler;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      pool-name: JobSchedulerH2Pool

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

---
# Development Configuration
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: true

  flyway:
    clean-disabled: false

---
# Production Configuration
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        generate_statistics: false

  flyway:
    clean-disabled: true
    validate-on-migrate: true
