# Default persistence configuration
# Features #5: Job Persistence, #48: Multi-Database Support

# Active profiles (comma-separated)
spring.profiles.active=postgresql,dev

# Application name
spring.application.name=job-scheduler-persistence

# Logging
logging.level.com.enterprise.scheduler.persistence=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.flywaydb=INFO

# JPA
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
